<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Color Scheme Generator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Geom:ital,wght@0,300..900;1,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/reset.css">
	<link rel="stylesheet" href="assets/style.css">
</head>

<body>
	<header>
		<h1>Simply Brilliant</h1>
		<p class="subheading">Color Palette Generator</p>
	</header>
	<main>
		<form id="color-form">
			<div class="seed-color-input-wrapper">
				<p class="seed-color-overlay">Select color</p>
				<input type="color"
				id="seed-color-input"
				class="seed-color-input"
				name="seedColor"
				value="#31d3d6"
				title="Pick a color"
				aria-label="color picker" />
			</div>
			<div class="dropdown-wrapper">
				<select
					id="scheme-dropdown"
					name="schemeMode"
					class="scheme-dropdown"
					required>
				</select>
			</div>
			<div id="create-palette-btn-wrapper">
				<input
				id="create-palette-btn"
				type="submit"
				value="Create Palette"
				class="btn create-palette-btn" />
			</div>
		</form>
		<div id="generated-palette"></div>
	</main>
	<footer id="footer">
		<button id="copy-all-btn" class="btn hidden">
			Click to copy all hex values
		</button>
		<p id="click-any-color" class="hidden">
			click any color to copy its value.
		</p>
	</footer>
	<script src="index.js"></script>
</body>
</html>
